---

- name: Perform the normal apt update / upgrade process
  become: true
  gather_facts: false
  hosts: '{{ HOSTS }}'

  tasks:

    - name: Update all packages to their latest version
      ansible.builtin.apt:
        name: "*"
        update_cache: true
        state: latest

    - name: Autoremove
      ansible.builtin.apt:
        autoremove: true

    - name: Clean leftovers
      ansible.builtin.apt:
        clean: true

    - name: Get listing of unneeded files
      ansible.builtin.find:
        path: '/var/lib/apt/lists'
        file_type: any
        hidden: true
      register: directory_content

    - name: Remove the unneeded files we foung
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ directory_content.files }}"
      loop_control:
        label: "{{ item.path }}"


    #  Sample use:
    #  make PLAYBOOK=apt_upgrade.yaml HOSTS=prod_swarm, run-on-hosts

...
